schema_version: "2.0"
name: explore_projects
version: "1.0.1"
owner: ai-runtime
tenant_scope: actor_membership
roles: [ADMIN, MANAGER, EMPLOYEE]
risk_level: READ_ONLY
input_contract: work_management_ai.tools.context.contracts.ExploreProjectsInput
output_contract: work_management_ai.tools.context.contracts.ContextReadObservation
timeout_seconds: 5
max_attempts: 1
retry_policy: NONE
idempotency: NOT_APPLICABLE
audit: SAFE_METADATA
trace_metadata: [tool_id, duration_ms, result_status]
description: >-
  Search authorized Projects when a name or search phrase identifies an unresolved Project.
  Provide a query and optionally a cursor and page size. Returns scoped candidates, resolution,
  and coverage. Ask for clarification when ambiguous. A partial page does not establish
  uniqueness, and an empty result also covers resources the current actor cannot see.
