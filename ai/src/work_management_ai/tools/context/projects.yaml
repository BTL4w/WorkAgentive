schema_version: "2.0"
name: explore_projects
version: "1.0.2"
owner: ai-runtime
tenant_scope: actor_membership
roles: [ADMIN, MANAGER, EMPLOYEE]
risk_level: READ_ONLY
input_contract: work_management_ai.tools.context.contracts.ExploreProjectsInput
output_contract: work_management_ai.tools.context.contracts.ContextReadObservation
timeout_seconds: 5
max_attempts: 1
retry_policy: NONE
idempotency: NOT_APPLICABLE
audit: SAFE_METADATA
trace_metadata: [tool_id, duration_ms, result_status]
description: >-
  Find Projects visible to the current actor by name or search phrase when the Project has not
  been uniquely identified. Returns candidates and a resolution status. One candidate on a
  partial page is still unresolved. Use read_project_context for the overview of an already
  identified Project.
