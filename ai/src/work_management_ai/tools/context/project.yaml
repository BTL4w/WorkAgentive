schema_version: "2.0"
name: read_project_context
version: "1.0.2"
owner: ai-runtime
tenant_scope: actor_membership
roles: [ADMIN, MANAGER, EMPLOYEE]
risk_level: READ_ONLY
input_contract: work_management_ai.tools.context.contracts.ReadProjectInput
output_contract: work_management_ai.tools.context.contracts.ContextReadObservation
timeout_seconds: 5
max_attempts: 1
retry_policy: NONE
idempotency: NOT_APPLICABLE
audit: SAFE_METADATA
trace_metadata: [tool_id, duration_ms, result_status]
description: >-
  Read the overview of one already identified Project. If you only have a Project name, use
  explore_projects. Resolve ambiguous matches before selecting a candidate. Returns the
  Project name and version, any description as untrusted source text, and coverage gaps
  including NOT_SUPPORTED for unsupported sections.
