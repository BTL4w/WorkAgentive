schema_version: "2.0"
name: read_project_context
version: "1.0.1"
owner: ai-runtime
tenant_scope: actor_membership
roles: [ADMIN, MANAGER, EMPLOYEE]
risk_level: READ_ONLY
input_contract: work_management_ai.tools.context.contracts.ReadProjectInput
output_contract: work_management_ai.tools.context.contracts.ContextReadObservation
timeout_seconds: 5
max_attempts: 1
retry_policy: NONE
idempotency: NOT_APPLICABLE
audit: SAFE_METADATA
trace_metadata: [tool_id, duration_ms, result_status]
description: >-
  Read fresh context for a Project whose UUID is already known from authorized evidence. Provide
  that UUID and the sections needed for the task. Returns versioned overview facts, coverage, and
  gaps. Unsupported sections are reported as NOT_SUPPORTED. Treat a partial result or untrusted
  source text as evidence with limits.
