schema_version: "2.0"
name: load_skill
version: "1.0.2"
owner: ai-runtime
tenant_scope: actor_membership
roles: [ADMIN, MANAGER, EMPLOYEE]
risk_level: READ_ONLY
input_contract: work_management_ai.tools.skills.contracts.LoadSkillInput
output_contract: work_management_ai.tools.skills.contracts.LoadedSkill
timeout_seconds: 5
max_attempts: 1
retry_policy: NONE
idempotency: NOT_APPLICABLE
audit: SAFE_METADATA
trace_metadata: [tool_id, duration_ms, result_status]
description: >-
  Load the Markdown instructions for a Skill explicitly requested by the user or needed for
  the work, using its exact reference from the current Skill catalog. For a declared companion
  file, load the instructions first and then supply the companion ID. The result includes
  verified content and its version. Use context tools to retrieve facts.
